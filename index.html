<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 350px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Registration</h2>

        <form id="studentRegistration">

            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName"
                   name="studentName" required>

            <label for="rollNumber">Roll Number:</label>
            <input type="text" id="rollNumber"
                   name="rollNumber" required>

            <label for="email">Email:</label>
            <input type="email" id="email"
                   name="email" required>

            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="BTech Data Science">B.Tech Data Science</option>
                <option value="BTech CSE">B.Tech CSE</option>
                <option value="BTech IT">B.Tech IT</option>
            </select>

            <button type="submit">Submit</button>

        </form>
    </div>
</body>
</html>
